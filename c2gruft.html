<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 2 - Gruft Archiv</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #120e1a;
            --card-bg: #1d1729;
            --accent-color: #f1b32c;
            --admin-color: #ff4a4a;
            --text-color: #ffffff;
            --text-muted: #7e748f;
            --border-color: #382d4d;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999;
        }

        .login-box {
            background-color: var(--card-bg); padding: 30px;
            border-radius: 12px; border: 1px solid var(--border-color);
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%; max-width: 350px; box-sizing: border-box;
        }

        .app-container { display: none; width: 100%; max-width: 700px; flex-direction: column; }
        header { text-align: center; margin-bottom: 30px; position: relative; }
        h1 { color: var(--accent-color); margin-bottom: 5px; }
        .section-box { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { margin-bottom: 6px; font-weight: bold; font-size: 14px;}
        input, select, textarea { padding: 12px; border-radius: 6px; border: 1px solid var(--border-color); background-color: #0b0810; color: white; font-size: 16px; font-family: inherit; }
        textarea { resize: vertical; min-height: 60px; }
        select option:disabled { color: #4a3f5a; background-color: #100c16; }
        button { background-color: var(--accent-color); color: #000; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: #ffc847; }
        .status-msg { margin-top: 10px; font-size: 14px; font-style: italic; }
        
        .team-image-wrapper { position: relative; margin-bottom: 25px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); background-color: #0b0810; }
        .team-image-wrapper img { width: 100%; display: block; }
        .team-note-box { background-color: #161120; padding: 12px; border-top: 1px solid var(--border-color); font-size: 14px; color: #e2daf0; }
        
        /* Modifikatoren Grid */
        .boss-info-display { position: relative; background: #161120; padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); margin-top: 15px; }
        .mod-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 10px; }
        .mod-item { background-color: #251d34; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); cursor: help; font-size: 14px; }
        .mod-item:hover { border-color: var(--accent-color); }

        .delete-btn { display: none; position: absolute; top: 10px; right: 10px; background-color: var(--admin-color); color: white; padding: 6px 12px; font-size: 12px; border-radius: 4px; z-index: 10; border: none; cursor: pointer; }
        .delete-boss-btn { display: none; position: absolute; top: 15px; right: 15px; background-color: var(--admin-color); color: white; padding: 6px 12px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; }
        
        .logout-btn { position: absolute; top: 0; right: 0; background: #382d4d; color: white; padding: 6px 12px; font-size: 12px; }
        .logout-btn:hover { background: var(--admin-color); }
        .admin-toggle-link { display: inline-block; margin-top: 15px; font-size: 12px; color: var(--text-muted); cursor: pointer; text-decoration: underline; }
        .admin-toggle-link:hover { color: var(--accent-color); }
    </style>
</head>
<body>

    <!-- LOGIN MASKE -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2 style="color: var(--accent-color); margin-top:0;">Gilden-Zugang</h2>
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">Chapter 2 - Gruft Archiv</p>
            
            <div id="memberForm">
                <div class="form-group">
                    <label for="memberPasswordInput" style="text-align: left;">Gilden-Passwort:</label>
                    <input type="password" id="memberPasswordInput" placeholder="••••••••" onkeypress="if(event.key === 'Enter') loginAsMember()">
                </div>
                <button onclick="loginAsMember()" style="width: 100%; margin-top: 10px;">Einloggen</button>
                <div class="admin-toggle-link" onclick="toggleAdminLogin(true)">Als Admin anmelden</div>
            </div>

            <div id="adminForm" style="display: none;">
                <div class="form-group">
                    <label for="adminEmailInput" style="text-align: left;">Admin E-Mail:</label>
                    <input type="email" id="adminEmailInput" placeholder="deine-mail@gmail.com">
                </div>
                <div class="form-group">
                    <label for="adminPasswordInput" style="text-align: left;">Admin Passwort:</label>
                    <input type="password" id="adminPasswordInput" placeholder="••••••••" onkeypress="if(event.key === 'Enter') loginAsAdmin()">
                </div>
                <button onclick="loginAsAdmin()" style="width: 100%; margin-top: 10px; background-color: var(--admin-color); color: white;">Admin Login</button>
                <div class="admin-toggle-link" onclick="toggleAdminLogin(false)">Zurück zum Mitglieder-Login</div>
            </div>

            <p id="loginError" style="color: var(--admin-color); font-size: 14px; margin-top: 14px; display: none;"></p>
        </div>
    </div>

    <!-- APP CONTAINER -->
    <div class="app-container" id="appContainer">
        <header>
            <button class="logout-btn" onclick="logout()">Ausloggen</button>
            <h1>Chapter 2 - Gruft Archiv</h1>
            <p style="color: var(--text-muted)">Erfolgreiche Setups & Modifikatoren (Stufen 1 - 500)</p>
            <span id="roleBadge" style="font-size: 12px; background: #382d4d; padding: 4px 10px; border-radius: 20px;">Nutzer-Modus</span>
        </header>

        <!-- BOSS-MODIFIKATOREN AUTOMATISCH MIT BILD SCANNEN -->
        <div class="section-box">
            <h3 style="margin-top:0; color: var(--accent-color);">Boss-Modifikatoren automatisch erfassen</h3>
            <div class="form-group">
                <label for="uploadBossLevelSelect">Gruft Tiefe (1-500):</label>
                <select id="uploadBossLevelSelect"></select>
            </div>
            <div class="form-group">
                <label for="bossImageFile">Boss-Screenshot hochladen (wird gescannt & danach gelöscht):</label>
                <input type="file" id="bossImageFile" accept="image/*">
            </div>
            <button onclick="scanAndSaveBoss()" style="width: 100%;">Bild scannen & Boss-Daten speichern</button>
            <div id="bossScanStatus" class="status-msg"></div>
        </div>

        <!-- UPLOAD: TEAM SCREENSHOT -->
        <div class="section-box">
            <h3 style="margin-top:0; color: var(--accent-color);">Erfolgreiches Team beitragen</h3>
            <div class="form-group">
                <label for="uploadLevelSelect">Gruft Tiefe (1-500):</label>
                <select id="uploadLevelSelect"></select>
            </div>
            <div class="form-group">
                <label for="imageFile">Screenshot (Datei oder STRG+V):</label>
                <input type="file" id="imageFile" accept="image/*">
            </div>
            <div class="form-group">
                <label for="uploadNote">Notiz / Infos zum Team (Optional):</label>
                <textarea id="uploadNote" placeholder="Z.B. Teambuilding, wichtige Items, Taktik..."></textarea>
            </div>
            <button onclick="uploadToSupabase()" style="width: 100%;">Team hinzufügen</button>
            <div id="uploadStatus" class="status-msg"></div>
        </div>

        <!-- ANSEHEN / SUCHE -->
        <div class="section-box">
            <h3 style="margin-top:0; color: var(--accent-color);">Archiv durchsuchen</h3>
            <div class="form-group">
                <label for="viewLevelSelect">Ebene auswählen:</label>
                <select id="viewLevelSelect" onchange="loadLevelData()">
                    <!-- Dynamisch -->
                </select>
            </div>
            
            <!-- Hier landen die Boss-Modifikatoren -->
            <div id="bossDataView"></div>
            
            <!-- Hier landen die Teambilder -->
            <div id="imageGallery" style="margin-top: 20px;"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://lmqpjhxoihjiepqhfeek.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxtcXBqaHhvaWhqaWVwcWhmZWVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1ODUwMzksImV4cCI6MjA5ODE2MTAzOX0.YvZp6rXlqDp59YOqtA2fQ6aaTLpR0Fz-mmqZ6OswU2Y';

        const MEMBER_EMAIL = 'jonasroth+mitgliedc2@gmail.com';
        const ADMIN_EMAIL = 'jonasroth+adminc2@gmail.com';

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let isAdmin = false;

        window.onload = async () => {
            buildDropdowns();
            setupPasteFeature();
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) { handleUserSession(session.user); }
        };

        function buildDropdowns() {
            const upTeams = document.getElementById('uploadLevelSelect');
            const upBoss = document.getElementById('uploadBossLevelSelect');
            upTeams.innerHTML = ''; upBoss.innerHTML = '';
            for (let i = 1; i <= 500; i++) {
                const opt1 = document.createElement('option'); opt1.value = i; opt1.textContent = `Ebene ${i}`;
                const opt2 = document.createElement('option'); opt2.value = i; opt2.textContent = `Ebene ${i}`;
                upTeams.appendChild(opt1); upBoss.appendChild(opt2);
            }
        }

        function setupPasteFeature() {
            window.addEventListener('paste', (e) => {
                const items = e.clipboardData.items;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf('image') !== -1) {
                        const blob = items[i].getAsFile();
                        const fileInput = document.getElementById('imageFile');
                        const file = new File([blob], "pasted-image.png", { type: blob.type });
                        const dataTransfer = new DataTransfer();
                        dataTransfer.items.add(file);
                        fileInput.files = dataTransfer.files;
                        document.getElementById('uploadStatus').textContent = "Bild aus Zwischenablage für das Team eingefügt!";
                        document.getElementById('uploadStatus').style.color = "#49e37d";
                    }
                }
            });
        }

        function toggleAdminLogin(showAdmin) {
            document.getElementById('loginError').style.display = "none";
            document.getElementById('memberForm').style.display = showAdmin ? "none" : "block";
            document.getElementById('adminForm').style.display = showAdmin ? "block" : "none";
        }

        async function loginAsMember() {
            const password = document.getElementById('memberPasswordInput').value;
            if (!password) { alert("Bitte Passwort eingeben."); return; }
            const { data, error } = await _supabase.auth.signInWithPassword({ email: MEMBER_EMAIL, password: password });
            if (error) { document.getElementById('loginError').textContent = "Falsches Gilden-Passwort!"; document.getElementById('loginError').style.display = "block"; return; }
            handleUserSession(data.user);
        }

        async function loginAsAdmin() {
            const email = document.getElementById('adminEmailInput').value;
            const password = document.getElementById('adminPasswordInput').value;
            if (!email || !password) { alert("Bitte Daten eingeben."); return; }
            const { data, error } = await _supabase.auth.signInWithPassword({ email: email, password: password });
            if (error) { document.getElementById('loginError').textContent = "Login fehlgeschlagen: " + error.message; document.getElementById('loginError').style.display = "block"; return; }
            handleUserSession(data.user);
        }

        function handleUserSession(user) {
            isAdmin = (user.email === ADMIN_EMAIL);
            document.getElementById('roleBadge').textContent = isAdmin ? "🔒 Admin-Modus" : "Nutzer-Modus";
            document.getElementById('roleBadge').style.backgroundColor = isAdmin ? "var(--admin-color)" : "#382d4d";
            document.getElementById('loginOverlay').style.display = "none";
            document.getElementById('appContainer').style.display = "flex";
            loadInitialDropdownData();
        }

        async function logout() { await _supabase.auth.signOut(); window.location.reload(); }

        async function loadInitialDropdownData() {
            const { data: teams } = await _supabase.from('setups').select('level');
            const { data: bosses } = await _supabase.from('boss_data').select('level');

            const activeLevels = new Set();
            if(teams) teams.forEach(t => activeLevels.add(t.level));
            if(bosses) bosses.forEach(b => activeLevels.add(b.level));

            const select = document.getElementById('viewLevelSelect');
            const currentVal = select.value;
            select.innerHTML = '';

            for (let i = 1; i <= 500; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = activeLevels.has(i) ? `Ebene ${i} (Daten vorhanden)` : `Ebene ${i} (Kein Eintrag)`;
                if (!activeLevels.has(i)) opt.disabled = true;
                select.appendChild(opt);
            }
            if (currentVal && activeLevels.has(parseInt(currentVal))) select.value = currentVal;
            else if (activeLevels.size > 0) select.value = Array.from(activeLevels).sort((a,b)=>a-b)[0];

            loadLevelData();
        }

// KORRIGIERT: Bereinigt Teambild-Pfade und verhindert Doppelungen nach Uploads
async function loadLevelData() {
    const level = document.getElementById('viewLevelSelect').value;
    if (!level) return;

    // 1. Boss-Modifikatoren Container komplett leeren und neu aufbauen
    const bossView = document.getElementById('bossDataView');
    bossView.innerHTML = '';

    const { data: boss } = await _supabase.from('boss_data').select('*').eq('level', level).maybeSingle();

    if (boss) {
        const bossCard = document.createElement('div');
        bossCard.className = 'boss-info-display';
        
        let deleteButtonHtml = '';
        if (isAdmin) {
            deleteButtonHtml = `<button class="delete-boss-btn" style="display: block;" onclick="deleteBossData(${boss.level})">Boss-Eintrag löschen</button>`;
        }

        bossCard.innerHTML = `
            <h3>Boss-Details (Tiefe ${level})</h3>
            ${deleteButtonHtml}
            <p><strong>Affinität:</strong> ${boss.element}</p>
            <strong>Modifikatoren (Hover für Info):</strong>
        `;
        
        const grid = document.createElement('div');
        grid.className = 'mod-grid';

        const { data: library } = await _supabase.from('modifiers_library').select('*').in('name_de', boss.mods);
        
        if(library) {
            library.forEach(mod => {
                const item = document.createElement('div');
                item.className = 'mod-item';
                item.setAttribute('title', mod.description || "Keine Beschreibung hinterlegt.");
                
                const englName = mod.name_en ? ` (${mod.name_en})` : '';
                item.innerHTML = `✨ <strong>${mod.name_de}</strong>${englName}`;
                grid.appendChild(item);
            });
        }
        bossCard.appendChild(grid);
        bossView.appendChild(bossCard);
    }

    // 2. Teams Container komplett leeren und neu laden
    const gallery = document.getElementById('imageGallery');
    gallery.innerHTML = '';
    const { data: teams } = await _supabase.from('setups').select('*').eq('level', level);

    if (teams && teams.length > 0) {
        teams.forEach(team => {
            const wrapper = document.createElement('div');
            wrapper.className = 'team-image-wrapper';
            const img = document.createElement('img'); 
            
            // KORREKTUR: Nutzt das exakte Datenbankfeld 'image_url' aus deiner Tabelle
            img.src = team.image_url; 
            wrapper.appendChild(img);

            if (team.note) {
                const nBox = document.createElement('div'); 
                nBox.className = 'team-note-box'; 
                nBox.textContent = team.note; 
                wrapper.appendChild(nBox);
            }

            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn'; 
            delBtn.textContent = 'Bild Löschen';
            if (isAdmin) delBtn.style.display = "block";
            
            // KORREKTUR: Übergibt den korrekten Bildpfad an die Löschfunktion
            delBtn.onclick = () => deleteTeam(team.id, team.image_url);
            
            wrapper.appendChild(delBtn); 
            gallery.appendChild(wrapper);
        });
    }
}
        async function scanAndSaveBoss() {
            const levelSelect = document.getElementById('uploadBossLevelSelect');
            const fileInput = document.getElementById('bossImageFile');
            const status = document.getElementById('bossScanStatus');

            const level = parseInt(levelSelect.value, 10);
            if (!fileInput.files[0]) { alert("Bitte einen Boss-Screenshot auswählen."); return; }

            status.textContent = "Bilderkennung in der Cloud läuft... Bitte warten...";
            status.style.color = "var(--accent-color)";

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onloadend = async function () {
                const base64String = reader.result;

                try {
                    const response = await fetch(`${SUPABASE_URL}/functions/v1/analyze-boss`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                        },
                        body: JSON.stringify({ imageBase64: base64String })
                    });

                    const result = await response.json();

                    if (result.success) {
                        const { error: dbError } = await _supabase
                            .from('boss_data')
                            .upsert({ level: level, element: result.element, mods: result.modifiers });

                        if (dbError) throw dbError;

                        status.textContent = `Boss erfolgreich erfasst! Affinität: ${result.element}. Modifikatoren: ${result.modifiers.join(', ')}`;
                        status.style.color = "#49e37d";
                        fileInput.value = '';

                        await loadInitialDropdownData();
                        document.getElementById('viewLevelSelect').value = level;
                        loadLevelData();
                    } else {
                        status.textContent = "Erkennungsfehler: " + result.error;
                        status.style.color = "var(--admin-color)";
                    }
                } catch (err) {
                    status.textContent = "Fehler beim Verarbeiten oder Speichern.";
                    status.style.color = "var(--admin-color)";
                    console.error(err);
                }
            };
            reader.readAsDataURL(file);
        }

        // KORRIGIERT: Robuster Bild-URL-Pfad für fehlerfreie Anzeige
        async function uploadToSupabase() {
            const levelSelect = document.getElementById('uploadLevelSelect');
            const fileInput = document.getElementById('imageFile');
            const noteInput = document.getElementById('uploadNote');
            const status = document.getElementById('uploadStatus');

            const level = parseInt(levelSelect.value, 10);
            if (!fileInput.files[0]) { alert("Datei wählen."); return; }

            status.textContent = "Team wird hochgeladen...";
            status.style.color = "var(--accent-color)";

            const file = fileInput.files[0];
            const fileExtension = file.name.split('.').pop();
            const anonymousFileName = `${Date.now()}-${Math.random().toString(36).substring(2, 11)}.${fileExtension}`;

            const { error: storageError } = await _supabase.storage.from('gruft-bilder').upload(anonymousFileName, file);
            if (storageError) { status.textContent = "Fehler: " + storageError.message; status.style.color = "var(--admin-color)"; return; }

            // Sicherer URL-Abruf
            const { data } = _supabase.storage.from('gruft-bilder').getPublicUrl(anonymousFileName);
            const publicUrl = data.publicUrl;
            
            const { error: dbError } = await _supabase.from('setups').insert([{ level: level, image_url: publicUrl, note: noteInput.value.trim() || null }]);
            if (dbError) { status.textContent = "Fehler: " + dbError.message; status.style.color = "var(--admin-color)"; return; }

            status.textContent = "Team erfolgreich gespeichert!";
            status.style.color = "#49e37d";
            fileInput.value = ''; noteInput.value = '';
            
            await loadInitialDropdownData();
            document.getElementById('viewLevelSelect').value = level;
            loadLevelData();
        }

        // NEU: Admin-Funktion zum vollständigen Löschen des Boss-Eintrags eines Levels
        async function deleteBossData(level) {
            if (!confirm(`Möchtest du die Boss-Modifikatoren für Ebene ${level} wirklich komplett löschen?`)) return;
            
            const { error } = await _supabase.from('boss_data').delete().eq('level', level);
            
            if (error) {
                alert("Fehler beim Löschen: " + error.message);
            } else {
                await loadInitialDropdownData();
            }
        }

        async function deleteTeam(id, url) {
            if (!confirm("Dieses Setup löschen?")) return;
            const fileName = url.split('/').pop();
            await _supabase.storage.from('gruft-bilder').remove([fileName]);
            await _supabase.from('setups').delete().eq('id', id);
            await loadInitialDropdownData();
        }
    </script>
</body>
</html>
